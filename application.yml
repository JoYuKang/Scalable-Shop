spring:
  application:
    name: ecommerce-data-platform
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    uris: http://localhost:9200
  servlet:
    multipart:
      # 100만 행 CSV 벌크 업로드를 받으려면 기본값(1MB)으론 턱없이 부족함
      max-file-size: 300MB
      max-request-size: 300MB

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:ecommerce;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      # H2(embedded)는 mode 기본값이 always라 data.sql이 자동으로 돎 - 테스트는 각자
      # 필요한 데이터를 직접 만들어 쓰므로 꺼둔다. 기본 시드는 mysql 프로파일에만 넣는다.
      mode: never

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3307/sshop?serverTimezone=UTC&characterEncoding=UTF-8
    username: application
    password: application
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # data.sql이 Hibernate가 만든 테이블에 넣는 것이므로 스키마 생성 뒤에 실행되게 함
    defer-datasource-initialization: true
  sql:
    init:
      # 기본값(embedded-only)은 MySQL 같은 실 DB에서 data.sql을 안 돌려서 always로 지정
      mode: always